# Checks every pull request (whatever branch it targets, so stacked stage PRs are checked too) and every
# push to main, as the Engineering standard requires once the code is on GitHub ("CI", "Code style",
# "Scans and SBOM"). Any failing job blocks the merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its older run; every commit on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the development tools (hash-checked; tools/make_lock.py)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install dependencies (hash-checked; CI runs PyTorch's CPU build, tools/make_lock.py)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-torch-cpu.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - run: mypy
      - name: License check of the shipped packages, each listed with its verdict (Legal & Compliance standard)
        # --with-system: without it pip-licenses leaves out setuptools, which requirements.lock ships, and the check
        # fails on a shipped package it cannot see.
        run: |
          pip-licenses --with-system --format=json > licenses.json
          python tools/check_licenses.py --packages requirements.lock requirements-torch-cpu.lock < licenses.json

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the trace matrix reads the commit subjects that cite requirements
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Qt offscreen rendering needs these libraries on a bare Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Install dependencies (hash-checked; CI runs PyTorch's CPU build, tools/make_lock.py)
        shell: bash
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-torch-cpu.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Tests, with line coverage of aoi/core and aoi/data (fails under 80 %, ADR 0003)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts' || '' }}
        run: pytest -q --cov --cov-report=term-missing --junitxml=test-results.xml
      - name: Pages of a failed screenshot comparison, with a diff image per page (tests/screens)
        if: runner.os == 'Linux' && failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: screens-actual
          path: tests/screens/actual/
          if-no-files-found: ignore
      - name: Review renders at 1366x768 and 4K at 150 % and 200 %, for Jay's review of the layouts (REQ-SET-004)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/render_screens.py --out screens-review/1366x768 --size 1366x768
          python tools/render_screens.py --out screens-review/3840x2160-at-150 --size 3840x2160 --scale 1.5
          python tools/render_screens.py --out screens-review/3840x2160-at-200 --size 3840x2160 --scale 2
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: runner.os == 'Linux'
        with:
          name: screens-review
          path: screens-review/
          retention-days: 30
      - name: Trace matrix (requirement to commits and tests; the G1 gate only reports until S59)
        if: runner.os == 'Linux' && always()
        continue-on-error: true
        run: python tools/trace_matrix.py --junit test-results.xml --git-log --out trace-matrix --gate G1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: runner.os == 'Linux' && always()
        with:
          name: trace-matrix
          path: |
            trace-matrix/
            perf.json

  locks:
    name: Lock files match their inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the development tools (hash-checked; tools/make_lock.py)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Regenerate the four lock files from their inputs and compare (prints any difference)
        run: python tools/make_lock.py --check

  perf:
    name: Performance (base vs head)
    # Engineering standard, "Measured in CI": a slowdown over 10 % fails the build. A runner is another machine every
    # time, so the base commit is timed beside the head (for a pull request, the merge commit) on this one runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the base commit beside the head
        if: env.BASE_SHA != '0000000000000000000000000000000000000000'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: .perf-base
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install dependencies (hash-checked; CI runs PyTorch's CPU build, tools/make_lock.py)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-torch-cpu.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Time the base and the head; fails when the head is over 10 % slower (exit 1) or they cannot be compared
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "perf: the push created the branch, so there is no base commit to compare with"
            exit 0
          fi
          python tools/perf_compare.py --base .perf-base --head . --out perf-compare.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: perf-compare
          path: perf-compare.json
          if-no-files-found: ignore

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads every commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the development tools (hash-checked; tools/make_lock.py)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Bandit (full report; High findings fail the job)
        run: |
          bandit -q -r aoi main.py tools --exit-zero
          bandit -q -r aoi main.py tools --severity-level high
      - name: pip-audit (known vulnerabilities in every locked package, both PyTorch builds included)
        run: |
          pip-audit --no-deps -r requirements-dev.lock
          # The vulnerability database knows torch by its public version: 2.14.1, not 2.14.1+cpu.
          sed -n -E 's/^([A-Za-z0-9._-]+)==([^+ ;]+).*/\1==\2/p' requirements-torch-*.lock | sort -u > torch-pins.txt
          pip-audit --no-deps -r torch-pins.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: gitleaks (secrets in any commit)
        env:
          GITLEAKS_VERSION: v8.30.1 # built from source; the Go checksum database verifies the module
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --verbose .
