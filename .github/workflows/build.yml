# Builds the app for Windows with PyInstaller, one folder, and checks that it opens and inspects a synthetic board
# (REQ-SET-012; Engineering standard "Build"; Legal & Compliance "Packaging" and "Notices shipped"; ADR 0007). Then
# Inno Setup wraps the folder in an installer, which is installed silently, self-tested and uninstalled on the runner
# (stage S57). The folder and the installer are kept as the run's artifacts for 30 days, named for the tag when a v*
# tag was pushed. Both are internal test builds: unsigned and not a release, since a release comes only as a signed
# installer from a tagged commit after two approvals (Engineering, "Signing"); a tag's build is the unsigned part.
name: Windows build

on:
  pull_request:
    paths:
      - installer/**
      - requirements*.txt
      - requirements*.lock
      - tools/third_party_notices.py
      - tools/sbom.py  # the bill of materials the build writes beside the notices
      - tools/smoke_test_build.py
      - tools/make_selftest_data.py  # the self-test's boards: drawn from the regression set, judged by aoi/selftest.py
      - tools/make_synthetic_dataset.py
      - tests/regression/**
      - aoi/selftest.py
      - tools/make_demo_bundle.py  # the demo bundle the build ships (REQ-SET-007), with what it loads it
      - aoi/core/demo.py
      - installer/aoi.iss  # the installer (S57) and its check on the runner
      - tools/check_installer.py
      - .github/workflows/build.yml
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Inno Setup's compiler, from Chocolatey's community package of that version, which checks the download's SHA-256;
  # the runner images document 6.7.1 preinstalled. tools/third_party_notices.py names the same version (ADR 0007).
  INNO_SETUP_VERSION: "6.7.1"

jobs:
  windows:
    name: Windows one-folder build
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write  # the build's own short-lived identity, for the provenance below (ADR 0011, decision 2)
      attestations: write
    env:  # the Stage 1 pilot's signing certificate (tools/new_pilot_signing.ps1); empty until it is made
      PILOT_SIGNING_PFX: ${{ secrets.PILOT_SIGNING_PFX }}
      PILOT_SIGNING_PASSWORD: ${{ secrets.PILOT_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install PyTorch's CPU build, the runtime packages and PyInstaller, each file checked against its hash
        shell: bash
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-torch-cpu.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip check
      - name: Build the demo bundle the app ships (REQ-SET-007); stops unless its boards get the demo's verdicts
        run: python tools/make_demo_bundle.py
      - name: Build; stops on a file no license check covers, and writes THIRD_PARTY_NOTICES.txt and sbom.cdx.json
        id: build
        run: pyinstaller --noconfirm --clean installer/aoi.spec
      - name: Sign the app's executable with the pilot certificate, on main and tags once it exists (ADR 0011)
        if: github.event_name != 'pull_request' && env.PILOT_SIGNING_PFX != ''
        run: tools/pilot_sign.ps1 dist/AOI-PoC-Inspector/AOI-PoC-Inspector.exe
      - name: Start the built app on an empty workspace, check that it opens, and inspect a board with --self-test
        id: smoke
        run: python tools/smoke_test_build.py dist/AOI-PoC-Inspector/AOI-PoC-Inspector.exe
      - name: After a failed start, rebuild with a console and start that, so the log shows the error
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          AOI_BUILD_CONSOLE: "1"
        run: |
          pyinstaller --noconfirm --distpath dist-console --workpath build-console installer/aoi.spec
          python tools/smoke_test_build.py dist-console/AOI-PoC-Inspector/AOI-PoC-Inspector.exe
      - name: Add BUILD-INFO.txt and SHA256SUMS.txt, and name the artifact
        id: info
        shell: python
        env:
          COMMIT: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          import hashlib, os, sys
          from datetime import UTC, datetime
          from pathlib import Path

          sys.path.insert(0, ".")
          from aoi.config import APP_NAME, APP_VERSION

          env, short = os.environ, os.environ["HEAD_SHA"][:7]
          tag = env["TAG"]  # a v* tag names the version the app says it is: v0.2.0, or v0.2.0-rc.1
          if tag and tag != f"v{APP_VERSION}" and not tag.startswith(f"v{APP_VERSION}-"):
              sys.exit(f"The tag {tag} does not name version {APP_VERSION}, the one in aoi/config.py")
          folder = Path("dist", APP_NAME.replace(" ", "-"))
          (folder / "BUILD-INFO.txt").write_text(
              f"{APP_NAME} {APP_VERSION}, internal test build {tag + ' ' if tag else ''}g{short}\n"
              f"Built by GitHub Actions on {datetime.now(UTC).isoformat(timespec='seconds')} from commit {env['COMMIT']}"
              f" ({env['REF']}, head {env['HEAD_SHA']}): {env['RUN_URL']}\n\n"
              "Not a release. Neither it nor its installer is signed, so Windows may warn that the publisher is\n"
              "unknown, and it must not go to a customer or into a demo: a release is a signed installer built from a\n"
              "tagged commit after two approvals (Engineering standard, \"Signing\"; Customers & Launch, \"Demos\").\n\n"
              "Start AOI-PoC-Inspector.exe. The workspace is %USERPROFILE%\\AOI_Workspace, or the folder AOI_WORKSPACE\n"
              "names. Third-party licenses: THIRD_PARTY_NOTICES.txt. The bill of materials (CycloneDX):\n"
              "sbom.cdx.json. The hash of every file: SHA256SUMS.txt.\n",
              encoding="utf-8",
              newline="\r\n",
          )
          sums = []
          for path in sorted(p for p in folder.rglob("*") if p.is_file()):
              with path.open("rb") as f:
                  sums.append(f"{hashlib.file_digest(f, 'sha256').hexdigest()}  {path.relative_to(folder).as_posix()}")
          (folder / "SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="utf-8", newline="\r\n")
          name = f"{folder.name}-{tag or APP_VERSION}-g{short}-windows-x64-unsigned"
          with open(env["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"name={name}\n")
          print(f"{name}: {len(sums)} files, {sum(p.stat().st_size for p in folder.rglob('*') if p.is_file()) / 1e6:.0f} MB")
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.info.outputs.name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Install Inno Setup ${{ env.INNO_SETUP_VERSION }}, and stop unless the one installed is that version
        id: inno
        run: |
          choco install innosetup --version $env:INNO_SETUP_VERSION --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "No ISCC.exe at $iscc" }
          # ISCC.exe has no file version (it reads 0.0.0): take the version Inno Setup's own setup records in its
          # uninstall entry, else the file version of Compil32.exe beside ISCC.exe
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
          $found = (Get-ItemProperty $keys -ErrorAction SilentlyContinue | Select-Object -First 1).DisplayVersion
          if (-not $found) {
            $v = (Get-Item (Join-Path (Split-Path $iscc) "Compil32.exe")).VersionInfo
            $found = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart)"
          }
          "Inno Setup found: $found"
          if ($found -ne $env:INNO_SETUP_VERSION) { throw "Inno Setup $found is installed, not the version pinned" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Compile the installer with the app's version from aoi/config.py
        id: installer
        run: |
          $version = python -c "from aoi.config import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:ISCC "/DAppVersion=$version" installer\aoi.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "dist\installer\AOI-PoC-Inspector-$version-setup-x64-unsigned.exe"
          if (-not (Test-Path $setup)) { throw "The compiler made no $setup" }
          "setup=$setup" >> $env:GITHUB_OUTPUT
      - name: Sign the installer with the pilot certificate, on main and tags once it exists (ADR 0011)
        if: github.event_name != 'pull_request' && env.PILOT_SIGNING_PFX != ''
        env:
          SETUP: ${{ steps.installer.outputs.setup }}
        run: tools/pilot_sign.ps1 $env:SETUP
      - name: Install it silently, run the installed app's --self-test, and uninstall it, which must keep the workspace
        id: check_installer
        env:
          SETUP: ${{ steps.installer.outputs.setup }}
        run: python tools/check_installer.py $env:SETUP
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.info.outputs.name }}-installer
          path: ${{ steps.installer.outputs.setup }}
          retention-days: 30
          if-no-files-found: error
      - name: Sign the build's provenance with GitHub's keyless signing (Sigstore), on main and tags only
        # Who built which file from which commit, verifiable by anyone with `gh attestation verify FILE -R
        # jdseo921/pcb-aoi-monitor`: no key to keep, no account to pay for (ADR 0011, decision 2). It is not an
        # Authenticode signature, so Windows still calls the publisher unknown.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.installer.outputs.setup }}
            dist/AOI-PoC-Inspector/AOI-PoC-Inspector.exe
            dist/AOI-PoC-Inspector/SHA256SUMS.txt
