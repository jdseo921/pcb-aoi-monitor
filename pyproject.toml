# Tool settings for the checks CI runs on every pull request (Engineering standard, "Code style").
# The app itself is not packaged from here yet; see README.md for install steps.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern syntax, likely bugs.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["aoi", "tests", "tools"]

[tool.mypy]
python_version = "3.11"
# Strict on the engine and data layers, as the standard requires, and since S22a on the screens (aoi/ui) and aoi/hal
# too, with no flag relaxed; the five pages below are typed in S22b.
files = ["aoi/core", "aoi/data", "aoi/times.py", "aoi/hal", "aoi/ui"]
strict = true
warn_unreachable = true
# scikit-image functions carry no annotations, so calling them is allowed.
untyped_calls_exclude = ["skimage"]

[[tool.mypy.overrides]]
# Typed in S22b; until then their errors are ignored, not fixed.
module = ["aoi.ui.pages.compare", "aoi.ui.pages.inspection", "aoi.ui.pages.model_test", "aoi.ui.pages.recipe_editor",
          "aoi.ui.pages.training"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the app as a package from the repository root.
pythonpath = ["."]
qt_api = "pyside6"

[tool.coverage.run]
# Line coverage of the engine and data layers (Engineering standard, "Tests": 80 % target). CI reports it on
# every run; the gate is not enforced until the Stage 1 suite has grown (ADR 0003).
source = ["aoi/core", "aoi/data"]

[tool.coverage.report]
show_missing = true
precision = 1
