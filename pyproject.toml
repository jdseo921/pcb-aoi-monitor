# Tool settings for the checks CI runs on every pull request (Engineering standard, "Code style").
# The app itself is not packaged from here yet; see README.md for install steps.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern syntax, likely bugs, and a type hint on every function argument and
# return value (Engineering, Code style: "type hints on every public function"): mypy checks aoi/, and ruff's ANN
# rules hold tools/, main.py and tests/ to the same shape. ANN401 stays off: the service layer's record dicts are Any
# by design.
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["aoi", "tests", "tools"]

[tool.mypy]
python_version = "3.11"
# Strict on the engine and data layers, as the standard requires, and since S22 on the screens (aoi/ui) and aoi/hal
# too, with no flag relaxed.
files = ["aoi/core", "aoi/data", "aoi/times.py", "aoi/hal", "aoi/ui", "aoi/selftest.py"]
strict = true
warn_unreachable = true
# scikit-image functions carry no annotations, so calling them is allowed.
untyped_calls_exclude = ["skimage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the app as a package from the repository root.
pythonpath = ["."]
qt_api = "pyside6"

[tool.coverage.run]
# Line coverage of the engine and data layers (Engineering standard, "Tests": 80 % target), measured on every CI run.
source = ["aoi/core", "aoi/data"]

[tool.coverage.report]
show_missing = true
precision = 1
# The gate: a run under 80 % fails (pytest-cov honours fail_under). Turned on at 0.2.0, when the suite measured
# 97.4 % (ADR 0003, item 6; #114).
fail_under = 80
